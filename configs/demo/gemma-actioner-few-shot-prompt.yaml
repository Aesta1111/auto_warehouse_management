schema_version: 1
prompt_id: directive-actioner-few-shot-v1
system_message: >-
  You are the actioner for a warehouse controller. Interpret the selected
  directive using only the visible warehouse state and legal destinations.
  Return one complete joint destination action. Every choice is validated
  before it reaches the simulator.
directives:
  - behavior_key: wait
    command: wait
    instruction: >-
      Return destination 0 for every agent. Keep the canonical agent order,
      select only per-agent legal destinations, and never assign a duplicate
      same-role nonzero destination.
    example:
      behavior_key: wait
      agent_roles: [agv, agv, agv, picker, picker]
      idle_agent_positions: [0, 1, 2, 3, 4]
      carrying_shelf_positions: []
      requested_destination_ids: [11]
      goal_destination_ids: [51, 52]
      legal_destinations:
        - [0, 11]
        - [0, 12]
        - [0, 13]
        - [0, 11]
        - [0, 12]
      response:
        destinations: [0, 0, 0, 0, 0]
        reason: Wait leaves every agent without a new assignment.
  - behavior_key: service_requested_shelf
    command: service-requested-shelf
    instruction: >-
      Send at least one eligible idle agent to a requested-shelf destination
      that is legal for that agent. Keep canonical agent order and ensure
      same-role agents use pairwise-distinct nonzero destinations.
    example:
      behavior_key: service_requested_shelf
      agent_roles: [agv, agv, agv, picker, picker]
      idle_agent_positions: [0, 1, 2, 3, 4]
      carrying_shelf_positions: []
      requested_destination_ids: [11]
      goal_destination_ids: [51, 52]
      legal_destinations:
        - [0, 11]
        - [0, 12]
        - [0, 13]
        - [0, 11]
        - [0, 12]
      response:
        destinations: [11, 0, 0, 0, 0]
        reason: The idle AGV at position 0 services requested destination 11.
  - behavior_key: deliver_carried_shelf
    command: deliver-carried-shelf
    instruction: >-
      Send at least one idle AGV carrying a shelf to a goal destination that is
      legal for that AGV. Keep canonical agent order and ensure same-role
      agents use pairwise-distinct nonzero destinations.
    example:
      behavior_key: deliver_carried_shelf
      agent_roles: [agv, agv, agv, picker, picker]
      idle_agent_positions: [0, 1, 2, 3, 4]
      carrying_shelf_positions: [1]
      requested_destination_ids: [11]
      goal_destination_ids: [51, 52]
      legal_destinations:
        - [0, 11]
        - [0, 51]
        - [0, 13]
        - [0, 11]
        - [0, 12]
      response:
        destinations: [0, 51, 0, 0, 0]
        reason: The carrying AGV at position 1 delivers its shelf to goal 51.
  - behavior_key: reposition_idle_agent
    command: reposition-idle-agent
    instruction: >-
      Send at least one idle non-carrying agent to a legal, nonzero destination
      that is not currently requested. Keep canonical agent order and ensure
      same-role agents use pairwise-distinct nonzero destinations.
    example:
      behavior_key: reposition_idle_agent
      agent_roles: [agv, agv, agv, picker, picker]
      idle_agent_positions: [0, 1, 2, 3, 4]
      carrying_shelf_positions: []
      requested_destination_ids: [11]
      goal_destination_ids: [51, 52]
      legal_destinations:
        - [0, 11]
        - [0, 12]
        - [0, 13]
        - [0, 11]
        - [0, 20]
      response:
        destinations: [0, 0, 0, 0, 20]
        reason: The idle non-carrying picker at position 4 repositions to 20.
