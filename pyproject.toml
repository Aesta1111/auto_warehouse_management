[project]
name = "auto-warehouse-management"
version = "0.1.0"
description = "Science-fair research on PPO and LLM task assignment in TA-RWARE"
requires-python = ">=3.12,<3.13"
dependencies = [
    "gymnasium==0.29.1",
    "httpx>=0.28.1,<1",
    "numpy==1.26.4",
    "pydantic>=2.11.7,<3",
    "pyastar2d==1.1.4",
    "PyYAML>=6.0.3,<7",
    "tarware @ git+https://github.com/uoe-agents/task-assignment-robotic-warehouse@6109c33f7228cace1e463c81f0568b754ff5f198",
]

[dependency-groups]
dev = [
    "basedpyright>=1.39.9",
    "ruff>=0.12.2,<0.13",
    "pytest>=8.4.1,<9",
    "stable-baselines3==2.9.0",
    "sb3-contrib==2.9.0",
    "torch==2.8.0",
    "transformers==5.13.1",
    "peft==0.19.1",
    "accelerate==1.14.0",
    "bitsandbytes==0.49.2",
    "ipykernel>=7.3.0",
    "lightning>=2.5,<2.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/warehouse_ai"]

[tool.uv]
# TA-RWARE's fork uses the same API but cannot compile with MSVC. The maintained
# PyPI wheel provides the astar_path API TA-RWARE calls and supports Windows.
override-dependencies = ["pyastar2d==1.1.4"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.basedpyright]
typeCheckingMode = "standard"
venvPath = "."
venv = ".venv"
